[pytest]
# Keep `pytest` (run bare from the repo root, as CI does) deterministic
# regardless of what artifact trees happen to exist on a given machine.
#
# The repo's output/backup/archive trees contain FULL COPIES of the test
# suite (e.g. 06_BACKUPS/<snapshot>/character-bibles/.../tests/). Without
# this guard, `pytest` from the root recurses into them and fails at
# COLLECTION time on duplicate module basenames and broken relative
# imports -- taking down the whole run. CI only passes today because its
# fresh checkout lacks the gitignored backup dir; any local dev that has
# run a backup hits the failure. Excluding these trees makes local == CI.
#
# A DENYLIST ALONE IS NOT ENOUGH. It only excludes artifact trees somebody
# remembered to list, so every new scratch/staging/export tree re-breaks the
# whole suite. That is exactly what happened with `artifacts/release_staging/`
# (a full repo copy staged during a release verification): bare `pytest` died
# with 52 collection errors while CI stayed green, because a fresh checkout has
# no such dir.
#
# So the real guard is `testpaths` below -- an ALLOWLIST of the live test roots.
# Collection is then immune to any artifact tree, named or not. `norecursedirs`
# is kept as defense-in-depth for explicitly-targeted runs (`pytest .`).
#
# testpaths applies only when pytest is invoked with no path arguments;
# `pytest path/to/test_x.py` still works normally.
#
# GUARD: scripts/tests/test_pytest_collection_integrity.py asserts this list
# covers every tracked test directory, so a new test root cannot be silently
# dropped from the default run.
testpaths =
    00_SYSTEM/scripts/genesis/tests
    00_SYSTEM/scripts/integration/tests
    00_SYSTEM/scripts/tests
    character-bibles/_library/tests
    character-bibles/_review_app/tests
    character-bibles/_schema/tests
    docs/tests
    scripts/tests

norecursedirs =
    artifacts
    06_BACKUPS
    05_RELEASE_ARCHIVE
    04_REJECTED_OUTPUTS
    04_APPROVED_FOR_PUSH
    02_ANTIGRAVITY_WORK
    01_CHATGPT_TO_ANTIGRAVITY
    01_IDEAS_INBOX
    .git
    node_modules
    __pycache__
    .pytest_cache
    *.egg-info
